name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore backend
        run: dotnet restore backend/SmartExpense.slnx

      - name: Build backend
        run: dotnet build backend/SmartExpense.slnx --configuration Release --no-restore --warnaserror

      - name: Test backend
        run: dotnet test backend/SmartExpense.slnx --configuration Release --no-restore --no-build --logger "console;verbosity=minimal"

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker smoke test
    needs:
      - backend
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: smartexpense-ci
      POSTGRES_DB: smartexpense_ci
      POSTGRES_USER: smartexpense_ci
      POSTGRES_PASSWORD: ci-only-postgres-password
      JWT_SIGNING_KEY: ci-only-jwt-signing-key-with-more-than-32-bytes
      POSTGRES_HOST_PORT: 5432
      FRONTEND_HOST_PORT: 8080
      POSTGRES_VOLUME_NAME: smartexpense-ci-postgres-data

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Test deployment helpers offline
        shell: pwsh
        run: |
          ./infra/aws/deployment/test_sender.ps1
          python3 -B -m unittest discover -s infra/aws/deployment -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Deployment helper tests failed.' }

      - name: Build Docker images
        run: docker compose --profile app build

      - name: Start Docker stack
        run: docker compose --profile app up --detach --no-build

      - name: Verify migration completion
        run: |
          migration_id="$(docker compose --profile app ps --all --quiet migrations)"

          if [ -z "$migration_id" ]; then
            echo "The migrations container was not created."
            exit 1
          fi

          migration_status="$(docker inspect --format '{{.State.Status}}' "$migration_id")"
          migration_exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$migration_id")"

          if [ "$migration_status" != "exited" ] || [ "$migration_exit_code" != "0" ]; then
            echo "Migrations did not complete successfully (status=$migration_status, exit=$migration_exit_code)."
            exit 1
          fi

      - name: Wait for healthy services
        run: |
          wait_for_healthy_service() {
            service="$1"
            container_id="$(docker compose --profile app ps --quiet "$service")"

            if [ -z "$container_id" ]; then
              echo "No running container found for $service."
              return 1
            fi

            for attempt in $(seq 1 30); do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"

              if [ "$health" = "healthy" ]; then
                echo "$service is healthy."
                return 0
              fi

              if [ "$health" = "exited" ] || [ "$health" = "dead" ]; then
                echo "$service stopped before becoming healthy."
                return 1
              fi

              echo "Waiting for $service health ($attempt/30, current=$health)..."
              sleep 2
            done

            echo "$service did not become healthy within 60 seconds."
            return 1
          }

          wait_for_healthy_service smart-expense-postgres
          wait_for_healthy_service api
          wait_for_healthy_service frontend

      - name: Verify API health inside Compose
        run: docker compose --profile app exec -T api wget -q -O - http://localhost:8080/health

      - name: Verify frontend root
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://localhost:8080/)"

          if [ "$status" != "200" ]; then
            echo "Expected frontend HTTP 200 but received $status."
            exit 1
          fi

      - name: Verify nginx API proxy and authentication
        run: |
          status="$(curl --silent --show-error --output /tmp/dashboard-response.txt --write-out '%{http_code}' 'http://localhost:8080/api/dashboard?month=1&year=2026')"

          if [ "$status" != "401" ]; then
            echo "Expected proxied dashboard request to return HTTP 401 but received $status."
            cat /tmp/dashboard-response.txt
            exit 1
          fi

      - name: Show Docker diagnostics
        if: failure()
        run: |
          docker compose --profile app ps --all || true
          docker compose --profile app logs --no-color --timestamps smart-expense-postgres migrations api frontend || true

      - name: Tear down Docker stack
        if: always()
        run: docker compose --profile app down --volumes --remove-orphans || true

  deploy:
    name: Deploy AWS demo
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: smart-expense-demo-deployment
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      EC2_PUBLIC_IP: ${{ vars.EC2_PUBLIC_IP }}
      RDS_HOST: ${{ vars.RDS_HOST }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate deployment variables and prepare non-secret config
        shell: pwsh
        run: |
          if ($env:AWS_ACCOUNT_ID -notmatch '^[0-9]{12}$' -or
              $env:AWS_DEPLOY_ROLE_ARN -ne "arn:aws:iam::$($env:AWS_ACCOUNT_ID):role/smart-expense-demo-github-deploy" -or
              $env:EC2_INSTANCE_ID -notmatch '^i-[0-9a-f]+$' -or
              $env:EC2_PUBLIC_IP -notmatch '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$' -or
              $env:RDS_HOST -notmatch '^[A-Za-z0-9.-]+\.us-east-1\.rds\.amazonaws\.com$' -or
              $env:IMAGE_TAG -notmatch '^[0-9a-f]{40}$') {
            throw 'Missing or invalid Repository Variables/release SHA.'
          }
          $registry = "$($env:AWS_ACCOUNT_ID).dkr.ecr.us-east-1.amazonaws.com"
          "ECR_REGISTRY=$registry" >> $env:GITHUB_ENV
          $config = @(
            'AWS_REGION=us-east-1', "ECR_REGISTRY=$registry", "IMAGE_TAG=$env:IMAGE_TAG",
            "RDS_HOST=$env:RDS_HOST", 'RDS_PORT=5432', 'RDS_DATABASE=smartexpense',
            'RDS_USERNAME=smartexpense', 'DB_PASSWORD_PARAMETER=/smart-expense/demo/db-password',
            'JWT_SIGNING_KEY_PARAMETER=/smart-expense/demo/jwt-signing-key'
          ) -join "`n"
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'deployment.env'), $config)

      - name: Assume deployment role via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: SmartExpense-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Build release images
        run: |
          docker build --platform linux/amd64 --target api -f backend/Dockerfile -t "$ECR_REGISTRY/smart-expense-api:$IMAGE_TAG" .
          docker build --platform linux/amd64 --target migrations -f backend/Dockerfile -t "$ECR_REGISTRY/smart-expense-api:$IMAGE_TAG-migrations" .
          docker build --platform linux/amd64 --target runtime -f frontend/Dockerfile -t "$ECR_REGISTRY/smart-expense-frontend:$IMAGE_TAG" frontend

      - name: Publish complete release
        run: |
          docker push "$ECR_REGISTRY/smart-expense-api:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/smart-expense-api:$IMAGE_TAG-migrations"
          docker push "$ECR_REGISTRY/smart-expense-frontend:$IMAGE_TAG"

      - name: Deploy via SSM and require successful completion
        shell: pwsh
        run: |
          ./infra/aws/deployment/deploy-via-ssm.ps1 -ConfigPath "$env:RUNNER_TEMP/deployment.env" -ParametersPath "$env:RUNNER_TEMP/ssm-deployment.json" -InstanceId $env:EC2_INSTANCE_ID -Execute -Wait

      - name: Verify external frontend and authenticated proxy
        run: |
          verify_status() {
            for attempt in $(seq 1 12); do
              status=$(curl --silent --show-error --connect-timeout 5 --max-time 10 --output /dev/null --write-out '%{http_code}' "http://$EC2_PUBLIC_IP$1") || status=000
              if [ "$status" = "$2" ]; then return 0; fi
              sleep 5
            done
            echo "External smoke failed: $1 expected $2, received $status."
            return 1
          }
          verify_status / 200
          verify_status /api/transactions 401

      - name: Clean runner deployment artifacts
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @('deployment.env', 'ssm-deployment.json')) {
            Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP $name) -Force -ErrorAction SilentlyContinue
          }
